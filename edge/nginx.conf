# =====================================================================================
# Proxy L4 de bord — nginx pour Windows, exécuté SUR LE PC HÔTE (hors Docker).
# Lancé par scripts/edge-proxy.ps1 (préfixe = ce dossier edge/).
#
# Pourquoi : Docker Desktop remplace l'IP du client par la passerelle du réseau Docker sur
# les ports publiés (172.x). Sans IP réelle, ni la détection par IP ni block_ip ne
# peuvent viser le PC Attaquant. Ce relais écoute le 443 de l'hôte, ne déchiffre RIEN
# (flux TCP/TLS transmis tel quel) et ajoute en tête de connexion un en-tête PROXY
# protocol portant l'IP d'origine. Le WAF (waf/nginx/default.conf.template) le lit.
#
# Chaîne : client ──443──▶ ce relais ──127.0.0.1:8443 (PROXY + TLS)──▶ WAF (conteneur)
#
# Limite connue : nginx pour Windows plafonne à ~1024 connexions simultanées (select()).
# Sous un flood massif, le relais peut saturer avant le WAF : le blocage d'IP au WAF
# libère alors les connexions de l'attaquant au fil de l'eau.
# =====================================================================================

worker_processes 1;
error_log logs/error.log warn;
pid       logs/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    server {
        listen 443;
        proxy_pass 127.0.0.1:8443;
        proxy_protocol on;
        proxy_connect_timeout 3s;
        # Long : le flux SSE de la console de remédiation reste ouvert.
        proxy_timeout 1h;
    }
}
