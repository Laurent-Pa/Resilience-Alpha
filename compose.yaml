# =====================================================================================
# PC Hôte — configuration de démo (proche de la prod). Le dev rapide reste compose.dev.yaml.
#
#   docker compose up -d --build        (fichier lu par défaut : compose.yaml)
#   docker compose ps / logs <service> / down
#
# Variables : .env à la racine (PUBLIC_HOST), cf. .env.example. Secrets : .secrets/ (README).
# Contrat de chaque service : docs/prod-interface.md. Construction pas à pas : README,
# section « Déploiement sur le PC Hôte ».
#
# Règles :
#  - aucun `ports:` sauf le WAF (127.0.0.1:8443, relayé par le proxy L4 Windows qui tient
#    le 443 public, cf. edge/) ; tout le reste circule sur des réseaux internes ;
#  - les URL PUBLIQUES (émetteur Keycloak, WAF) passent par https://${PUBLIC_HOST} ;
#    les appels de service à service restent internes (keycloak:8080, prober:8000, postgres) ;
#  - restart: unless-stopped partout : la plateforme doit survivre à la panne d'un service.
# =====================================================================================

# Projet distinct de compose.dev.yaml : conteneurs, volumes et réseaux séparés.
name: resilience-host

x-restart: &restart
  restart: unless-stopped

secrets:
  db_password:
    file: ./.secrets/db_password
  iban_hmac_key:
    file: ./.secrets/iban_hmac_key
  rsa_private_key:
    file: ./.secrets/rsa_private_key
  prober_client_secret:
    file: ./.secrets/prober_client_secret
  remediation_client_secret:
    file: ./.secrets/remediation_client_secret
  webhook_hmac_key:
    file: ./.secrets/webhook_hmac_key
  grafana_admin_password:
    file: ./.secrets/grafana_admin_password
  face_service_token:
    file: ./.secrets/face_service_token
  biometric_key:
    file: ./.secrets/biometric_key

services:
  # -----------------------------------------------------------------------------------
  # WAF : SEUL service publié. nginx + ModSecurity + OWASP CRS, TLS avec le certificat de
  # labo (étape 1). Routage et en-têtes : waf/nginx/default.conf.template.
  # -----------------------------------------------------------------------------------
  waf:
    <<: *restart
    # Tag "roulant" pour le premier essai ; le figer ensuite (voir README, étape 3).
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: ra-waf
    environment:
      # Blocage actif depuis la recette du 21/10 (parcours paiement, login, admin validés
      # en DetectionOnly ; faux positifs traités dans waf/modsecurity/). Pour diagnostiquer
      # un blocage suspect, repasser temporairement en DetectionOnly.
      MODSEC_RULE_ENGINE: "On"
      BLOCKING_PARANOIA: "1"
    volumes:
      - ./waf/nginx/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      # Exclusions CRS justifiées (faux positifs observés) : ciblées avant les règles,
      # globales après.
      - ./waf/modsecurity/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./waf/modsecurity/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:ro
      - ./certs/waf.crt:/etc/nginx/certs/waf.crt:ro
      - ./certs/waf.key:/etc/nginx/certs/waf.key:ro
    # Publié UNIQUEMENT sur la boucle locale du PC Hôte : le 443 public est tenu par le
    # proxy L4 Windows (edge/nginx.conf, scripts/edge-proxy.ps1) qui ajoute l'IP réelle
    # du client (PROXY protocol). Docker Desktop, seul, la remplacerait par sa passerelle.
    ports: ["127.0.0.1:8443:8443"]
    healthcheck:
      # Le 8443 exige l'en-tête PROXY : la sonde passe par le serveur HTTP interne (8080).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [edge, monitoring]

  # -----------------------------------------------------------------------------------
  # Base de données métier (payments) et journal du moteur (remediation)
  # -----------------------------------------------------------------------------------
  postgres:
    <<: *restart
    image: postgres:16-alpine
    container_name: ra-postgres
    environment:
      POSTGRES_DB: resilience
      POSTGRES_USER: payment_app
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_app -d resilience"]
      interval: 5s
      timeout: 2s
      retries: 10
    networks: [backend, monitoring]

  # -----------------------------------------------------------------------------------
  # Keycloak : derrière le WAF, en HTTP interne. TLS terminé au WAF (comme en prod).
  # -----------------------------------------------------------------------------------
  keycloak:
    <<: *restart
    # Image officielle + authenticator « reconnaissance faciale » (étape caméra du rôle ops).
    build: ./keycloak
    container_name: ra-keycloak
    command: ["start", "--import-realm"]
    # Bootstrap admin + valeurs des ${...} du realm (PROBER_CLIENT_SECRET, ...).
    env_file: ./.secrets/keycloak.env
    environment:
      KC_HTTP_RELATIVE_PATH: /auth
      # Émetteur PUBLIC figé pour tous les jetons, y compris ceux obtenus en interne
      # (prober, moteur) : pas de KC_HOSTNAME_BACKCHANNEL_DYNAMIC (DEPLOIEMENT-PROD.md §1, §4).
      KC_HOSTNAME: https://${PUBLIC_HOST:?PUBLIC_HOST absent de .env}/auth
      # HTTP derrière le WAF ; Keycloak lit X-Forwarded-* pour le schéma et l'hôte d'origine.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Résout ${PUBLIC_HOST:192.168.137.1} dans le realm (redirectUris de web-pay et web-ops)
      # à l'import. Le realm n'est importé que s'il n'existe pas : base H2 interne au
      # conteneur, donc à chaque recréation du conteneur.
      PUBLIC_HOST: ${PUBLIC_HOST}
      # Étape caméra des comptes ops : appel interne à face-auth (fail-closed si injoignable).
      FACE_AUTH_URL: http://face-auth:8000
    secrets: [face_service_token]
    volumes:
      - ./keycloak/realm-resilience.json:/opt/keycloak/data/import/realm-resilience.json:ro
    healthcheck:
      # Pas de curl dans l'image : requête HTTP brute en bash sur l'interface de gestion.
      # Deux chemins essayés (avec et sans /auth) selon la version de Keycloak.
      test:
        - CMD
        - bash
        - -c
        - >-
          for p in /auth/health/ready /health/ready; do
          exec 3<>/dev/tcp/127.0.0.1/9000 || exit 1;
          printf "GET $$p HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          grep -q '"UP"' <&3 && exit 0;
          done; exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [backend, edge, monitoring]

  # -----------------------------------------------------------------------------------
  # Services du pilier dev
  # -----------------------------------------------------------------------------------
  payment-api:
    <<: *restart
    build:
      context: .
      dockerfile: services/payment-api/Dockerfile
    container_name: ra-payment-api
    environment:
      LOG_LEVEL: INFO
      DB_HOST: postgres
      OIDC_ISSUER: https://${PUBLIC_HOST}/auth/realms/resilience
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/resilience/protocol/openid-connect/certs
      # Le front est servi par le WAF sur la même origine : CORS ne sert qu'en filet.
      CORS_ORIGINS: '["https://${PUBLIC_HOST}"]'
    secrets: [db_password, iban_hmac_key, rsa_private_key]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, edge, monitoring]

  # Second facteur facial du back-office. /internal : Keycloak seulement (jamais routé par
  # le WAF) ; aucune route publique.
  face-auth:
    <<: *restart
    build:
      context: .
      dockerfile: services/face-auth/Dockerfile
    container_name: ra-face-auth
    environment:
      LOG_LEVEL: INFO
      DB_HOST: postgres
      OIDC_ISSUER: https://${PUBLIC_HOST}/auth/realms/resilience
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/resilience/protocol/openid-connect/certs
      CORS_ORIGINS: '["https://${PUBLIC_HOST}"]'
      # Échecs consécutifs avant verrou de 5 min (défaut code : 2, consigne du sujet).
      MAX_FAILURES: "5"
    secrets: [face_service_token, biometric_key, db_password]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, edge, monitoring]

  # Front Next.js (paiement sous /, back-office sous /admin), servi par le WAF.
  # Les NEXT_PUBLIC_* sont FIGÉES dans le bundle au build : tout changement de PUBLIC_HOST
  # impose `docker compose build frontend`. API en chemins relatifs (même origine que le WAF).
  # Chaque argument doit être fourni : le Dockerfile poserait sinon une chaîne vide, qui
  # n'active pas les valeurs par défaut du code (`??`).
  frontend:
    <<: *restart
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/payments
        NEXT_PUBLIC_ADMIN_API_BASE_URL: /api/admin
        NEXT_PUBLIC_OIDC_AUTHORITY: https://${PUBLIC_HOST}/auth/realms/resilience
        NEXT_PUBLIC_ADMIN_OIDC_CLIENT_ID: web-ops
    container_name: ra-frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [edge, monitoring]

  # Sonde : jeton en interne, virement de preuve VIA LE WAF comme un vrai client.
  prober:
    <<: *restart
    build:
      context: .
      dockerfile: services/prober/Dockerfile
    container_name: ra-prober
    environment:
      LOG_LEVEL: INFO
      KC_TOKEN_URL: http://keycloak:8080/auth/realms/resilience/protocol/openid-connect/token
      TARGET_URL: https://${PUBLIC_HOST}
      CA_BUNDLE: /certs/lab-ca.pem
    secrets: [prober_client_secret]
    volumes:
      - ./certs/lab-ca.pem:/certs/lab-ca.pem:ro
    # edge : non interne, nécessaire pour joindre le WAF sur l'adresse publique du PC Hôte.
    networks: [backend, edge, monitoring]

  # Moteur de remédiation. EXECUTOR=fake jusqu'à l'étape 6 (playbooks + docker-socket-proxy).
  remediation-engine:
    <<: *restart
    build:
      context: .
      dockerfile: services/remediation-engine/Dockerfile
    container_name: ra-remediation-engine
    environment:
      LOG_LEVEL: INFO
      OIDC_ISSUER: https://${PUBLIC_HOST}/auth/realms/resilience
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/resilience/protocol/openid-connect/certs
      EXECUTOR: ansible
      VERIFIER: real
      PROBER_STATUS_URL: http://prober:8000/status
      LEDGER_URL: https://${PUBLIC_HOST}/api/admin/ledger/check
      CA_BUNDLE: /certs/lab-ca.pem
      KC_TOKEN_URL: http://keycloak:8080/auth/realms/resilience/protocol/openid-connect/token
      DB_HOST: postgres
      DOCKER_HOST: tcp://docker-socket-proxy:2375   # community.docker des playbooks (jamais docker.sock direct)
      # Connexion `local` : ansible résout ~ via passwd (/home/app, non inscriptible). Rooter le tmp dans /tmp.
      ANSIBLE_REMOTE_TEMP: /tmp/.ansible-tmp
      ANSIBLE_LOCAL_TEMP: /tmp/.ansible-tmp
    secrets: [webhook_hmac_key, remediation_client_secret, db_password]
    volumes:
      - ./certs/lab-ca.pem:/certs/lab-ca.pem:ro
      - ./ansible/playbooks:/playbooks:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, edge, monitoring, socketproxy]

  # Accès Docker filtré pour les playbooks du moteur (restart / exec), jamais docker.sock en direct.
  # N'autorise que les routes nécessaires ; isolé sur le réseau socketproxy avec le seul moteur.
  docker-socket-proxy:
    <<: *restart
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: ra-docker-socket-proxy
    environment:
      CONTAINERS: 1        # lister/inspecter (recycle_service)
      POST: 1              # autoriser les écritures (sinon API en lecture seule)
      EXEC: 1              # docker_container_exec (block_ip, kill_db_conns)
      ALLOW_RESTARTS: 1    # restart de conteneur (recycle_service) ; sinon 403 Forbidden
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socketproxy]

  # Détection ML (pilier IA) : lit Prometheus, poste une alerte signée HMAC au moteur
  # (http://remediation-engine:8000/alerts, cf. detection/config.py) quand une anomalie persiste.
  # model.joblib est gitignoré : le réentraîner sur le trafic du PC Hôte (detection/README.md).
  # Bind-mount pour lire le modèle réentraîné sans rebuild.
  detection:
    <<: *restart
    build:
      context: .
      dockerfile: detection/Dockerfile
    container_name: ra-detection
    volumes: ["./detection:/app/detection"]
    secrets: [webhook_hmac_key]
    depends_on: [remediation-engine, prometheus]
    networks: [monitoring]

  # -----------------------------------------------------------------------------------
  # Observabilité (Prometheus / Loki / Grafana). Réseau dédié "monitoring" : scrape les
  # services métier qui y sont aussi rattachés. Pas de `ports:` public (règle WAF) :
  # bindés en 127.0.0.1 uniquement, comme vault, pour un accès local au PC Hôte.
  # -----------------------------------------------------------------------------------
  prometheus:
    <<: *restart
    image: prom/prometheus:v2.54.1
    container_name: ra-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    ports: ["127.0.0.1:9090:9090"]
    # edge : monitoring est internal, Docker ne publie pas de port sur un réseau interne seul.
    networks: [monitoring, edge]

  loki:
    <<: *restart
    image: grafana/loki:3.2.0
    container_name: ra-loki
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    ports: ["127.0.0.1:3100:3100"]
    networks: [monitoring, edge]

  grafana:
    <<: *restart
    image: grafana/grafana:11.2.0
    container_name: ra-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: [grafana_admin_password]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus, loki]
    networks: [monitoring, edge]

  # Sonde HTTP générique pour les services sans /metrics natif (frontend, waf) : voir
  # prometheus/blackbox.yml et le job "blackbox-http" de prometheus.yml.
  blackbox-exporter:
    <<: *restart
    image: prom/blackbox-exporter:v0.25.0
    container_name: ra-blackbox-exporter
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks: [monitoring]

volumes:
  pg_data:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  # Données et appels internes (postgres, keycloak:8080, prober:8000). Sans accès sortant.
  backend:
    internal: true
  # Ce que le WAF sert (étape 3) + accès à l'adresse publique pour le prober et le moteur.
  edge: {}
  # Scrape des services métier par Prometheus (payment-api, prober, remediation-engine,
  # postgres rattachés ci-dessus). internal: true comme backend : pas d'accès sortant.
  monitoring:
    internal: true
  # Le moteur -> docker-socket-proxy uniquement. Sans accès sortant.
  socketproxy:
    internal: true
