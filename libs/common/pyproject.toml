[project]
name = "resilience-common"
version = "0.1.0"
description = "Briques transverses : logs JSON, métriques, health, auth Keycloak, HMAC, settings"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
