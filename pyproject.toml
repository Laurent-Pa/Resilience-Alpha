[project]
name = "resilience-alpha"
version = "0.1.0"
description = "Racine du workspace uv (aucun code)"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/common", "services/*", "detection"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/versions/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "resilience_common.auth.require_role",
]

[tool.ruff.lint.isort]
known-first-party = ["resilience_common", "payment_api", "prober", "remediation_engine", "config", "prom", "signing"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -ra"
testpaths = ["libs", "services", "detection"]
# Paquets first-party trouvés sans installation (dev au pip, sans uv) : pas de PYTHONPATH manuel.
pythonpath = [
    "libs/common/src",
    "services/payment-api/src",
    "services/prober/src",
    "services/remediation-engine/src",
    "detection",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning:testcontainers.*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
