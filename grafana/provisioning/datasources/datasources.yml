# ===================================================================
# PROVISIONING GRAFANA — sources de données automatiques
# Grâce à ce fichier, Prometheus et Loki sont branchés dans Grafana
# AU DÉMARRAGE, sans aucun clic dans l'interface.
# Les adresses utilisent les noms de conteneurs (prometheus, loki).
# ===================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
