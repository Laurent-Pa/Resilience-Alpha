# ===================================================================
# PROVISIONING GRAFANA — sources de données automatiques
# Prometheus et Loki branchés au démarrage, sans clic.
# Les uid fixes ("prometheus", "loki") sont référencés par les dashboards.
# ===================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
