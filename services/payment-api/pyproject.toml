[project]
name = "payment-api"
version = "0.1.0"
description = "API métier de paiement : virements idempotents, ledger en partie double"
requires-python = ">=3.12"
dependencies = [
    "resilience-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "cryptography>=43",
    "httpx>=0.27",  # relais vers rag-assistant (POST /admin/assistant/ask)
]

[tool.uv.sources]
resilience-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
