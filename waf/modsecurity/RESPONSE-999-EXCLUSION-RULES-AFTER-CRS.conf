# =====================================================================================
# Exclusions OWASP CRS propres à Resilience-Alpha. Chargé APRÈS les règles CRS (ordre
# alphabétique de rules/*.conf), d'où SecRuleRemoveById.
#
# Chaque exclusion doit être justifiée ici : on n'éteint une règle que pour un faux
# positif observé et compris, jamais pour « faire passer » un parcours sans l'analyser.
# =====================================================================================

# 920350 — « Host header is a numeric IP address » (PL1, +3 au score d'anomalie).
# Le sujet impose une adresse IP comme point d'entrée public (192.168.137.1, point d'accès
# Windows), sans nom DNS : la règle se déclencherait sur 100 % du trafic légitime et
# ajouterait 3 points à chaque requête, à 2 points du seuil de blocage (5).
# Observé le 21/10 sur GET /api/payments/public-key (journal d'audit du WAF).
SecRuleRemoveById 920350
