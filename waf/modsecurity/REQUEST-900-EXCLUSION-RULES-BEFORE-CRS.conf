# =====================================================================================
# Exclusions OWASP CRS ciblées, chargées AVANT les règles CRS (ordre alphabétique de
# rules/*.conf). On y retire une règle pour une cible précise, sur un chemin précis,
# plutôt que globalement. Identifiants 10000-19999 : plage réservée aux règles locales.
#
# Chaque exclusion doit être justifiée ici, comme dans RESPONSE-999-...-AFTER-CRS.conf.
# =====================================================================================

# 931100 — « Possible Remote File Inclusion (RFI): URL Parameter using IP Address »
# (PL1, critique : +5, soit le seuil de blocage à lui seul).
# Le flux OIDC envoie à Keycloak l'URL de retour de l'application en paramètre :
#   redirect_uri=https://192.168.137.1/callback, post_logout_redirect_uri=...
# Le point d'accès public étant une adresse IP (imposé par le sujet), la règle bloquait
# toute connexion et déconnexion. Observé le 21/10 en recette (8 occurrences, toutes sur
# les parcours de connexion alice / operator).
# Portée minimale : seulement ces deux paramètres, seulement sur les routes OIDC de
# Keycloak. La règle reste active partout ailleurs (API métier, autres paramètres).
# Keycloak valide de toute façon ces URL contre la liste blanche redirectUris du realm.
SecRule REQUEST_FILENAME "@beginsWith /auth/realms/resilience/protocol/openid-connect/" \
    "id:10010,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=931100;ARGS:redirect_uri,\
    ctl:ruleRemoveTargetById=931100;ARGS:post_logout_redirect_uri"

# 931100 (suite) — retour de Keycloak vers l'application.
# Keycloak renvoie le navigateur sur /callback (paiement) ou /admin/callback (back-office)
# avec le paramètre iss=https://<PUBLIC_HOST>/auth/realms/resilience (RFC 9207 :
# identification de l'émetteur, vérifiée par oidc-client-ts). Observé le 21/10 après
# passage en On : 403 sur /callback, « found within ARGS:iss ».
# Portée minimale : le seul paramètre iss, sur ces deux chemins exacts.
SecRule REQUEST_FILENAME "@rx ^/(?:admin/)?callback$" \
    "id:10011,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=931100;ARGS:iss"

# Capture faciale (A2FA ops) : le champ « image » est un data URL JPEG en base64 (~50 à
# 100 Ko) posté à l'étape caméra de Keycloak. Du base64 déclenche les règles SQLi/XSS du
# CRS (score 25 → 403). Contenu validé en aval par face-auth (décodage OpenCV).
# Portée minimale : ce seul paramètre, sur cette seule route.
SecRule REQUEST_FILENAME "@beginsWith /auth/realms/resilience/login-actions/authenticate" \
    "id:10012,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:image"
